<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>FitLife - Calculadora de consumo de água</title>
</head>

<body>

    <nav>
        <a href="../index.html" id="logo"><i class="fas fa-heartbeat" aria-hidden="true"></i> FitLife</a>

        <ul class="nav-links">
            <li> <a class="nav-link" href="../index.html">Home</a> </li>
            <li> <a class="nav-link" href="./imc.html">IMC</a> </li>
            <li> <a class="nav-link" href="./tmb.html">TMB</a> </li>
            <li> <a class="nav-link active" aria-current="page" href="./water.html">Água</a> </li>
        </ul>
    </nav>

    <header class="header-container">
        <h1><span><i class="fas fa-tint" aria-hidden="true"></i></span> Hidratação</h1>
        <p>Acompanhe sua meta diária de água.</p>
    </header>

    <main class="tool-main">
        <section class="tool-card">


            <p>Meta diária: 2500 ml</p>

            <div class="button-group">
                <button class="primary-button" type="button">+ 250 ml</button>
                <button class="secondary-button" type="button">Zerar</button>
            </div>

            <div class="result-panel">
                <label for="water-progress">Progresso</label>
                <progress id="water-progress" value="0" max="2500">0%</progress>
            </div>

            <p>Total: 0 ml</p>


            <a class="back-link" href="../index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar à home</a>

        </section>
    </main>

</body>

</html>
